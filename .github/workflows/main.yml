name: Build TeleChat Android APK

on:
  workflow_dispatch:
    inputs:
      telechat_url:
        description: "Public HTTPS URL of your deployed TeleChat server"
        required: true
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract TeleChat ZIP
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 1 -type f -name 'telechat-zbt-apk-ready*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "TeleChat ZIP not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf telechat-source
          mkdir -p telechat-source

          unzip -q "$ZIP" -d telechat-source

          if [ ! -d "telechat-source/telechat-work" ]; then
            echo "Expected telechat-work directory was not found"
            exit 1
          fi

          cp -a telechat-source/telechat-work/. .

          rm -rf telechat-source

          echo "Project files:"
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Install Capacitor
        run: |
          npm install --no-save --ignore-scripts \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK was not found at $ANDROID_HOME"
            exit 1
          fi

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

          if [ -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          fi

          ls -la "$ANDROID_HOME"

      - name: Show installed Android SDK
        shell: bash
        run: |
          echo "Installed Android platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo "Installed build tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Generate Android project
        env:
          TELECHAT_URL: ${{ inputs.telechat_url }}
        run: |
          set -e

          echo "TeleChat URL: $TELECHAT_URL"

          if [[ ! "$TELECHAT_URL" =~ ^https:// ]]; then
            echo "TELECHAT_URL must start with https://"
            exit 1
          fi

          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeleChat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
